name: gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 后台/source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: 后台/source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 一条命令覆盖七步：策略自测 / tsc --noEmit / vinext build / 全量测试 / 基线清单漂移 / 快照回归 / 覆盖率门槛
      - run: node scripts/gate.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log
          path: 后台/source/gate-*.log
          if-no-files-found: warn
