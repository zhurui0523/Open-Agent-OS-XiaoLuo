<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>示例面板插件</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px;
        display: grid;
        gap: 12px;
        align-content: start;
        background: #f7f8fc;
        color: #1f2430;
        font: 13px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }
      .hint {
        margin: 0;
        color: #6b7280;
      }
      .card {
        display: grid;
        gap: 8px;
        padding: 12px;
        border: 1px solid #e3e6ef;
        border-radius: 10px;
        background: #fff;
      }
      .card > h2 {
        margin: 0;
        font-size: 12px;
        font-weight: 650;
        color: #4f46e5;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 6px;
      }
      li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 8px;
        background: #f2f4fb;
      }
      li img {
        width: 34px;
        height: 34px;
        border-radius: 6px;
        object-fit: cover;
        background: #dfe3f0;
      }
      li span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tag {
        padding: 1px 6px;
        border-radius: 999px;
        background: #e0e7ff;
        color: #4338ca;
        font-size: 11px;
      }
      button {
        justify-self: start;
        padding: 6px 12px;
        border: 1px solid #cfd5e6;
        border-radius: 8px;
        background: #fff;
        color: #1f2430;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: #4f46e5;
        color: #4f46e5;
      }
      code {
        padding: 2px 6px;
        border-radius: 6px;
        background: #eef1f8;
        color: #b91c1c;
        word-break: break-all;
      }
      input[type="file"] {
        width: 100%;
        font: inherit;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>示例面板插件</h1>
      <p class="hint">
        这个页面运行在结果面板的插件页签里，用来验证宿主 → 插件的引用上下文通路。
      </p>
    </div>

    <div class="card">
      <h2>宿主引用上下文</h2>
      <p class="hint" id="state">等待宿主下发 xiaoluo:host-ready…</p>
      <ul id="refs"></ul>
    </div>

    <div class="card">
      <h2>旧版 file input 适配</h2>
      <p class="hint">
        宿主会把当前画布选中的引用素材注入下面的 input，无需插件主动拉取。
      </p>
      <input type="file" multiple accept="image/*,video/*,audio/*,.md,.txt" />
      <span class="hint" id="injected">尚未注入文件</span>
    </div>

    <div class="card">
      <h2>能力申请</h2>
      <p class="hint">
        面板插件向宿主申请未授予的能力时，宿主会拒绝并回传原因。
      </p>
      <button type="button" id="ask">申请 canvas:write</button>
      <code id="answer">尚未申请</code>
    </div>

    <script>
      (function () {
        var state = document.getElementById("state");
        var refs = document.getElementById("refs");
        var answer = document.getElementById("answer");
        var pending = new Map();

        window.addEventListener("message", function (event) {
          var data = event.data;
          if (!data || typeof data !== "object") return;

          if (data.type === "xiaoluo:host-ready") {
            var items = (data.assets || []).concat(data.texts || []);
            state.textContent = items.length
              ? "已接收 " + items.length + " 个引用（能力：" +
                (data.capabilities || []).join("、") + "）"
              : "宿主当前没有选中引用节点";
            refs.textContent = "";
            items.forEach(function (item) {
              var li = document.createElement("li");
              var tag = document.createElement("span");
              tag.className = "tag";
              tag.textContent = item.kind || "text";
              li.appendChild(tag);
              if (item.url) {
                var img = document.createElement("img");
                img.setAttribute("alt", "");
                img.setAttribute("src", item.url);
                li.appendChild(img);
              }
              var label = document.createElement("span");
              label.textContent = item.title || item.content || item.nodeId;
              li.appendChild(label);
              refs.appendChild(li);
            });
            return;
          }

          if (data.type === "xiaoluo:capability-response") {
            var resolve = pending.get(data.requestId);
            pending.delete(data.requestId);
            if (resolve) {
              resolve(data.ok ? "已授权" : data.error || "宿主拒绝了请求");
            }
          }
        });

        document.getElementById("ask").addEventListener("click", function () {
          var requestId = "demo-" + Date.now();
          answer.textContent = "申请中…";
          pending.set(requestId, function (text) {
            answer.textContent = text;
          });
          window.parent.postMessage(
            {
              type: "xiaoluo:capability-request",
              requestId: requestId,
              capability: "canvas:write",
            },
            "*",
          );
        });

        var injected = document.getElementById("injected");
        document.querySelector('input[type="file"]').addEventListener("change", function (event) {
          var files = Array.from(event.target.files || []);
          injected.textContent = files.length
            ? "已注入 " + files.length + " 个文件：" + files.map(function (file) { return file.name; }).join("、")
            : "尚未注入文件";
        });
      })();
    </script>
  </body>
</html>
